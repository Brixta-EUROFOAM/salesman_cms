services:
  eurofoamdashb:
    # Use your Docker image name here
    image: goswamirohit/eurofoamdashb:v1
    container_name: eurofoamdashb
    restart: unless-stopped
    ports:
      - "55004:3000"
    # This is the key line that tells Docker to read the variables from the .env file
    env_file:
      - .env.production

    environment:
      #- DATABASE_URL=${DATABASE_URL}
      #- NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      #- JWT_SECRET=${JWT_SECRET}
      - NODE_OPTIONS=--max-old-space-size=1536

    networks:
      - eurofoam_dashboard_net

networks:
  eurofoam_dashboard_net:
    name: eurofoam_dashboard_net